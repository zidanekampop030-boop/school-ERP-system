name: School ERP Microservices CI

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    # Build and Lint Auth Service
    - name: Build Auth Service
      run: |
        cd auth-service
        npm install
        npm run build
        npm test

    # Build and Lint Academic Service
    - name: Build Academic Service
      run: |
        cd academic-service
        npm install
        npm run build

    # Build and Lint Finance Service
    - name: Build Finance Service
      run: |
        cd finance-service
        npm install
        npm run build

    # Build and Lint HR Service
    - name: Build HR Service
      run: |
        cd hr-service
        npm install
        npm run build

    # Build and Lint API Gateway
    - name: Build API Gateway
      run: |
        cd api-gateway
        npm install
        npm run build
